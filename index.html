<!DOCTYPE html>
  <html lang="zh-CN">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>QuickCrop AI 图片工具</title>
      <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body {
              font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
              background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
              min-height: 100vh;
              display: flex;
              justify-content: center;
              align-items: center;
              padding: 20px;
              color: #fff;
          }
          .container {
              background: rgba(255,255,255,0.05);
              backdrop-filter: blur(20px);
              border-radius: 24px;
              padding: 40px;
              width: 100%;
              max-width: 500px;
              border: 1px solid rgba(255,255,255,0.1);
          }
          h1 {
              text-align: center;
              font-size: 28px;
              margin-bottom: 8px;
              background: linear-gradient(90deg, #60a5fa, #a78bfa);
              -webkit-background-clip: text;
              -webkit-text-fill-color: transparent;
          }
          .subtitle {
              text-align: center;
              color: #888;
              margin-bottom: 30px;
              font-size: 14px;
          }
          .upload-area {
              border: 2px dashed rgba(255,255,255,0.2);
              border-radius: 16px;
              padding: 40px 20px;
              text-align: center;
              cursor: pointer;
              transition: all 0.3s;
              margin-bottom: 20px;
          }
          .upload-area:hover { border-color: #60a5fa; background: rgba(96,165,250,0.05); }
          .upload-area.dragover { border-color: #60a5fa; background: rgba(96,165,250,0.1); }
          .upload-icon { font-size: 48px; margin-bottom: 12px; }
          .upload-text { color: #aaa; font-size: 14px; }
          .upload-text span { color: #60a5fa; cursor: pointer; }
          .actions { display: flex; gap: 10px; margin-top: 20px; }
          select, button {
              padding: 12px 20px;
              border: none;
              border-radius: 12px;
              font-size: 14px;
              cursor: pointer;
          }
          select {
              flex: 1;
              background: rgba(255,255,255,0.1);
              color: #fff;
          }
          select option { background: #1a1a2e; color: #fff; }
          .btn {
              background: linear-gradient(90deg, #60a5fa, #a78bfa);
              color: #fff;
              font-weight: 600;
              padding: 12px 28px;
              transition: opacity 0.3s;
          }
          .btn:hover { opacity: 0.9; }
          .btn:disabled { opacity: 0.5; cursor: not-allowed; }
          .preview { margin-top: 20px; display: none; }
          .preview img {
              width: 100%;
              border-radius: 12px;
          }
          .loading {
              display: none;
              text-align: center;
              padding: 20px;
          }
          .spinner {
              width: 40px; height: 40px;
              border: 4px solid rgba(255,255,255,0.1);
              border-top: 4px solid #60a5fa;
              border-radius: 50%;
              animation: spin 0.8s linear infinite;
              margin: 0 auto 12px;
          }
          @keyframes spin { to { transform: rotate(360deg); } }
          .result-title { font-size: 14px; color: #aaa; margin: 12px 0 8px; }
          .download-btn {
              display: inline-block;
              padding: 10px 24px;
              background: rgba(255,255,255,0.1);
              border-radius: 10px;
              text-decoration: none;
              color: #60a5fa;
              font-size: 14px;
              margin-top: 8px;
          }
          .error {
              color: #f87171;
              font-size: 14px;
              text-align: center;
              margin-top: 12px;
              display: none;
          }
      </style>
  </head>
  <body>
      <div class="container">
          <h1>QuickCrop</h1>
          <p class="subtitle">AI 图片处理工具</p>

          <div class="upload-area" id="uploadArea">
              <div class="upload-icon">🖼️</div>
              <p class="upload-text">拖拽图片到这里，或 <span>点击选择</span></p>
              <input type="file" id="fileInput" accept="image/*" style="display:none">
          </div>

          <div class="actions">
              <select id="modelSelect">
                  <option value="remove-bg">去除背景</option>
                  <option value="upscale">放大图片</option>
              </select>
              <button class="btn" id="processBtn" disabled>处理</button>
          </div>

          <div class="loading" id="loading">
              <div class="spinner"></div>
              <p>AI 处理中，请稍候...</p>
          </div>

          <div class="preview" id="preview">
              <p class="result-title">处理结果：</p>
              <img id="resultImg" src="" alt="处理结果">
              <br>
              <a class="download-btn" id="downloadBtn" download>下载图片</a>
          </div>

          <div class="error" id="error"></div>
      </div>

      <script>
          const uploadArea = document.getElementById('uploadArea');
          const fileInput = document.getElementById('fileInput');
          const processBtn = document.getElementById('processBtn');
          const modelSelect = document.getElementById('modelSelect');
          const loading = document.getElementById('loading');
          const preview = document.getElementById('preview');
          const resultImg = document.getElementById('resultImg');
          const downloadBtn = document.getElementById('downloadBtn');
          const error = document.getElementById('error');

          let selectedFile = null;

          uploadArea.addEventListener('click', () => fileInput.click());
          uploadArea.addEventListener('dragover', (e) => {
              e.preventDefault();
              uploadArea.classList.add('dragover');
          });
          uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
          uploadArea.addEventListener('drop', (e) => {
              e.preventDefault();
              uploadArea.classList.remove('dragover');
              if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
          });
          fileInput.addEventListener('change', () => {
              if (fileInput.files.length) handleFile(fileInput.files[0]);
          });

          function handleFile(file) {
              if (!file.type.startsWith('image/')) {
                  showError('请选择图片文件');
                  return;
              }
              selectedFile = file;
              processBtn.disabled = false;
              uploadArea.querySelector('.upload-text').innerHTML = `已选择：<strong>${file.name}</strong>`;
          }

          processBtn.addEventListener('click', async () => {
              if (!selectedFile) return;

              loading.style.display = 'block';
              preview.style.display = 'none';
              error.style.display = 'none';
              processBtn.disabled = true;

              try {
                  const model = modelSelect.value;
                  const formData = new FormData();
                  formData.append('image', selectedFile);

                  let endpoint = '/api/remove-bg';
                  if (model === 'upscale') endpoint = '/api/upscale';

                  const res = await fetch(endpoint, {
                      method: 'POST',
                      body: formData
                  });

                  if (!res.ok) {
                      const errText = await res.text();
                      throw new Error(errText || '处理失败');
                  }

                  const blob = await res.blob();
                  const url = URL.createObjectURL(blob);
                  resultImg.src = url;
                  downloadBtn.href = url;
                  downloadBtn.download = `quickcrop_${model}.${blob.type === 'image/png' ? 'png' : 'jpg'}`;
                  preview.style.display = 'block';
              } catch (e) {
                  showError('处理失败：' + e.message);
              } finally {
                  loading.style.display = 'none';
                  processBtn.disabled = false;
              }
          });

          function showError(msg) {
              error.textContent = msg;
              error.style.display = 'block';
          }
      </script>
  </body>
  </html>
